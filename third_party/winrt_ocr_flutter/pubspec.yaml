name: winrt_ocr_flutter
description: >
  On-device Windows OCR for Flutter. Wraps Windows.Media.Ocr via C++/WinRT
  behind a single recognizeText(imagePath) method channel call.
  Windows-only — designed to slot behind a per-platform OCR dispatch
  abstraction in a consuming app, alongside mobile OCR engines for
  Android/iOS.
version: 0.1.0
repository: https://github.com/EmpireBusinessSolutions/winrt_ocr_flutter

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.19.0'

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: WinrtOcrFlutterPluginCApi

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
